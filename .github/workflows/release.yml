name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract Version Info
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="1.1.${GITHUB_RUN_NUMBER}"
          fi

          # versionCode = major*10000 + minor*100 + patch (e.g. 1.1.6 -> 10106).
          # Tied to the tag, so it always increases with the version and does not
          # depend on the per-workflow run counter. Assumes minor/patch <= 99.
          if [[ $GITHUB_REF == refs/tags/* && "${VERSION%%-*}" =~ ^([0-9]+)(\.([0-9]+))?(\.([0-9]+))?$ ]]; then
            CODE=$(( 10#${BASH_REMATCH[1]:-0} * 10000 + 10#${BASH_REMATCH[3]:-0} * 100 + 10#${BASH_REMATCH[5]:-0} ))
          else
            CODE=${GITHUB_RUN_NUMBER}   # non-tag builds are never published
          fi

          echo "Version name: ${VERSION}, version code: ${CODE}"
          echo "VERSION_NAME=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${CODE}" >> $GITHUB_OUTPUT

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build Release APK
        run: >-
          ./gradlew assembleRelease 
          -PCI_VERSION_CODE=${{ steps.version.outputs.VERSION_CODE }} 
          -PCI_VERSION_NAME=${{ steps.version.outputs.VERSION_NAME }}
        env:
          KEYSTORE_FILE: ../keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Named APK
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/StreamViewer-v${{ steps.version.outputs.VERSION_NAME }}.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamViewer-v${{ steps.version.outputs.VERSION_NAME }}
          path: release_apk/StreamViewer-v${{ steps.version.outputs.VERSION_NAME }}.apk

      - name: Create Release and Upload APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release_apk/StreamViewer-v${{ steps.version.outputs.VERSION_NAME }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
